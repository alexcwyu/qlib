[build-system]
requires = ["setuptools", "setuptools-scm", "cython", "numpy>=1.24.0"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "pyqlib"
dynamic = ["version"]
description = "A Quantitative-research Platform"
requires-python = ">=3.13,<3.15"
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "MIT" }

dependencies = [
  "pyyaml",
  "numpy",
  # Since version 1.1.0, pandas supports the ffill and bfill methods.
  # Since version 2.1.0, pandas has deprecated the method parameter of the fillna method. 
  # qlib has updated the fillna method in PR 1987 and limited the minimum version of pandas.
  # Pandas 3 ZoneInfo pickles require getattr, forbidden by artifact security.
  "pandas>=1.1,<3",
  # Qlib's filesystem tracking backend is disabled by default in MLflow 3.13.
  "mlflow!=3.15.1",
  # filelock 3.30 rejects forks while another thread changes lock descriptor ownership.
  "filelock>=3.16.0,!=3.30.0",
  "redis",
  "dill",
  "fire",
  "ruamel.yaml>=0.17.38",
  "python-redis-lock",
  "tqdm",
  "pymongo",
  "loguru",
  "lightgbm",
  "gym",
  "cvxpy",
  # Use the Windows/Python 3.8 wheel verified in PR #2308, including on fresh installs.
  "osqp==1.0.5; sys_platform == 'win32' and python_version == '3.8'",
  "joblib",
  "matplotlib",
  "jupyter",
  "nbconvert",
  # fastjsonschema 2.22 uses Python 3.10 type syntax without declaring the requirement.
  "fastjsonschema<2.22; python_version < '3.10'",
  "pyarrow",
  "pydantic-settings",
  "setuptools-scm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "statsmodels",
  "tomli; python_version < '3.11'",
]
# On macos-13 system, when using python version greater than or equal to 3.10,
# Current Torch and NumPy wheels are resolved and validated together in uv.lock.
rl = [
  # Qlib's finite collector uses the four-value Gym API (0.5 migrated to Gymnasium).
  "tianshou<0.5",
  "torch",
  "numpy",
]

lint = [
  # Keep Python and notebook formatting on the same version family.
  "black!=26.1.0",
  "pylint",
  "mypy",
  "flake8",
  "nbqa",
]
# snowballstemmer, a dependency of sphinx, was released on 2025-05-08 with version 3.0.0,
# which causes errors in the build process. So we've limited the version for now.
docs = [
  # Current Statsmodels and SciPy no longer require the removed private _lazywhere API.
  "scipy",
  "sphinx",
  "sphinx_rtd_theme",
  "readthedocs_sphinx_ext",
  "snowballstemmer",
]
package = [
  "twine",
  "build",
]
# test_pit dependency packages
test = [
  "yahooquery",
  "baostock",
  # Avoid source builds requiring external libxml2 headers on Windows.
  "lxml; sys_platform != 'win32'",
  "lxml<6.1.3; sys_platform == 'win32'",
]
analysis = [
  # Qlib still imports figure_factory.create_distplot, removed in Plotly 7.
  "plotly<7",
  "statsmodels",
]
client = [
  "python-socketio",
  "tables",
]

# In the process of releasing a new version, when checking the manylinux package with twine, an error is reported:
# InvalidDistribution: Invalid distribution metadata: unrecognized or malformed field 'license-file'
# To solve this problem, we added license-files here. Refs: https://github.com/pypa/twine/issues/1216
[tool.setuptools]
packages = [
  "qlib",
]
license-files = []

[project.scripts]
qrun = "qlib.cli.run:run"

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
write_to = "qlib/_version.py"

[dependency-groups]
dev = ["pytest", "pytest-cov", "statsmodels", "build", "cython"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
